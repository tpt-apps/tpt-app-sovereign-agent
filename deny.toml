# cargo-deny policy: every dependency must be compatible with both MIT and Apache-2.0.
# Run with: cargo deny check

[graph]
all-features = true

[licenses]
# Allow only permissive licences that are compatible with MIT OR Apache-2.0.
# Apache-2.0-only, GPL, AGPL, LGPL, SSPL and unknown licences are rejected.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "0BSD",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"

[advisories]
ignore = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/tpt-solutions/tpt-anima",
    "https://github.com/tpt-solutions/tpt-keystone-db",
    "https://github.com/tpt-solutions/tpt-crypto",
    "https://github.com/tpt-solutions/tpt-primitives",
    "https://github.com/tpt-solutions/tpt-appfront",
]
